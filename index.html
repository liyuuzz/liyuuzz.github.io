<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LiYuuzz 的数字基因实验室：由粒子双螺旋导航的 3D 个人空间。" />
    <meta name="theme-color" content="#060708" />
    <title>LiYuuzz · EIVETHEORY</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23060708'/%3E%3Ccircle cx='24' cy='32' r='6' fill='%234fd8e8'/%3E%3Ccircle cx='40' cy='32' r='6' fill='%23ff6b5e'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#about">跳到内容</a>

    <main class="stage" id="main">
      <canvas class="field" id="field" aria-hidden="true"></canvas>

      <div class="scene" id="scene">
        <div class="world" id="world">
          <div class="world__rot" id="worldRot"></div>
        </div>
      </div>

      <div class="tint" id="tint" aria-hidden="true"></div>
      <div class="wash" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
    </main>

    <!-- DNA 双螺旋目录：粒子构成的主链 + 四个功能碱基节点 -->
    <aside class="helix" aria-label="DNA 目录导航">
      <canvas id="helix"></canvas>
      <span class="helix__caption">SEQUENCE · 04</span>
    </aside>

    <header class="hud hud--top">
      <a class="brand" href="#home" data-nav="0">
        <span class="brand__name">LIYUUZZ</span>
        <span class="brand__role">EIVETHEORY&nbsp;LAB</span>
      </a>
      <div class="readout">
        <span class="readout__item"><i>DEPTH</i><b id="depth">0000</b></span>
        <span class="readout__item"><i>VEL</i><b id="vel">0.00</b></span>
      </div>
    </header>

    <footer class="hud hud--bottom">
      <p class="hint" id="hint"><span class="hint__k">滚轮 / 滑动</span>穿越空间</p>

      <div class="scale" aria-hidden="true">
        <span class="scale__track"><i class="scale__mark" id="scaleMark"></i></span>
        <span class="scale__labels"><b>0000</b><b>1560</b><b>3120</b><b>4680</b></span>
      </div>

      <p class="counter" id="counter">01 / 04</p>
    </footer>

    <div class="gate" id="eyeGate" aria-hidden="true">
      <div class="gate__black"></div>
      <div class="gate__stage">
        <canvas id="eyeCanvas"></canvas>
        <span class="gate__hint">CLICK TO SKIP</span>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
